<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e8354"/>
      <stop offset="100%" stop-color="#065f3e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Book Emblem -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Book spine / cover -->
    <rect x="32" y="24" width="320" height="336" rx="28" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="44" y="36" width="296" height="312" rx="20" fill="#ffffff"/>
    
    <!-- Spine line -->
    <rect x="44" y="36" width="36" height="312" rx="6" fill="#0e8354" fill-opacity="0.9"/>
    
    <!-- Golden Accent Ribbon -->
    <path d="M 230,36 L 230,120 L 250,104 L 270,120 L 270,36 Z" fill="#f59e0b"/>
    
    <!-- Text / Emblem "KTD" -->
    <text x="195" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#0e8354" text-anchor="middle" letter-spacing="2">KTD</text>
    <text x="195" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#334155" text-anchor="middle" letter-spacing="4">KHATA</text>
    
    <!-- Ledger Rules Lines -->
    <line x1="100" y1="285" x2="290" y2="285" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="305" x2="250" y2="305" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
